version: '3.8'

services:
  monitoring-dashboard:
    build: .
    container_name: monitoring-dashboard
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
    volumes:
      - ./data:/app/data
    networks:
      - monitoring-dashboard-network

networks:
  monitoring-dashboard-network:
    driver: bridge
